name: Rusty Robot integration
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['extension/**', '.github/workflows/rusty-robot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:security
      - run: npx --yes @vscode/vsce@3.7.1 package --no-dependencies --out aircodum-app-0.5.0.vsix
      - run: python3 scripts/verify-vsix.py aircodum-app-0.5.0.vsix
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: aircodum-vsix
          path: extension/aircodum-app-*.vsix
          if-no-files-found: error
  integration:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, arch: x64}
          - {os: ubuntu-22.04-arm, arch: arm64}
          - {os: windows-2022, arch: x64}
          - {os: windows-11-arm, arch: arm64}
          - {os: macos-14, arch: arm64}
          - {os: macos-15-intel, arch: x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          architecture: ${{ matrix.arch }}
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: aircodum-vsix
          path: extension/release-artifacts
      - run: python scripts/verify-vsix.py release-artifacts/aircodum-app-0.5.0.vsix
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check-types
      - run: npm run test:security
      - if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y xvfb libasound2 libgbm1 libnss3 libgtk-3-0
          xvfb-run -a --server-args="-screen 0 1920x1080x24 -noreset" node scripts/verify-vscode-host.cjs release-artifacts/aircodum-app-0.5.0.vsix
      - if: runner.os != 'Linux'
        run: node scripts/verify-vscode-host.cjs release-artifacts/aircodum-app-0.5.0.vsix
