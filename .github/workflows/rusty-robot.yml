name: Rusty Robot integration
on:
  pull_request:
    paths: ['extension/**', '.github/workflows/rusty-robot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
      - run: npm ci --no-audit --no-fund
      - run: npm run build:rusty-robot
      - run: npm run compile
      - run: npm run test:security
      - run: node --test native/rusty-robot/source/crates/rusty-robot-node/tests/media.cjs
